name: Daily Data Sync

on:
  schedule:
    # Run at 3:00 AM Dhaka time (GMT+6) = 9:00 PM UTC previous day
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

env:
  API_URL: https://ce-x-insights-main-1.vercel.app/api/analyze-topics

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Calculate yesterday's date (Dhaka GMT+6)
        id: date
        run: |
          YESTERDAY=$(TZ='Asia/Dhaka' date -d 'yesterday' '+%Y-%m-%d')
          echo "date=$YESTERDAY" >> $GITHUB_OUTPUT
          echo "Syncing data for: $YESTERDAY"

      # Step 1: Sync CSAT Ratings via the conversations REST API.
      # NOTE: Intercom's reporting-data export API (the old csat-enqueue/poll/import
      # path) silently stopped returning ratings for the conversation_rating_sent
      # dataset around 2026-07-03 — it returns ~8 rows via the public API even though
      # the UI Dataset Export still shows thousands. The REST search API is the only
      # programmatic source with populated ratings. We scan conversations CREATED in a
      # rolling 4-day window (ratings arrive 1-2 days after the chat) and bucket each by
      # its RATING submission date. Upsert is idempotent, so re-scanning is safe and
      # late-arriving ratings get picked up on subsequent nights.
      - name: Sync CSAT Ratings (REST)
        run: |
          for BACK in 3 2 1 0; do
            D=$(TZ='Asia/Dhaka' date -d "${{ steps.date.outputs.date }} - $BACK days" '+%Y-%m-%d')
            CURSOR=""
            DAY_RATED=0
            for pass in $(seq 1 25); do
              BODY="{\"action\":\"csat-sync-rest\",\"dateFrom\":\"$D\",\"dateTo\":\"$D\",\"maxPages\":40"
              if [ -n "$CURSOR" ]; then BODY="$BODY,\"cursor\":\"$CURSOR\""; fi
              BODY="$BODY}"
              RESP=$(curl -s --max-time 290 -X POST "$API_URL" -H "Content-Type: application/json" -d "$BODY")
              RATED=$(echo "$RESP" | jq -r '.rated // 0')
              DONE=$(echo "$RESP" | jq -r '.done // false')
              CURSOR=$(echo "$RESP" | jq -r '.nextCursor // ""')
              DAY_RATED=$((DAY_RATED + RATED))
              if [ "$DONE" = "true" ] || [ -z "$CURSOR" ] || [ "$CURSOR" = "null" ]; then break; fi
            done
            echo "$D: rated=$DAY_RATED"
          done

      # Step 1b: Patch CSAT Product Type via Intercom team derivation
      # (Topic-independent — fills any rows the csat-download-import forward-fix
      # couldn't enrich because Intercom Topic hasn't synced the date yet.)
      - name: Patch CSAT Product Type
        run: |
          FROM=$(TZ='Asia/Dhaka' date -d "${{ steps.date.outputs.date }} - 3 days" '+%Y-%m-%d')
          curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
            -d "{\"action\":\"csat-patch-product-type\",\"dateFrom\":\"$FROM\",\"dateTo\":\"${{ steps.date.outputs.date }}\"}" | jq .

      # Step 1c: Classify CSAT sub-categories (OpenAI Batch API) — loop until none left.
      # Batch actions already deployed; re-run safe (only rows with a rating and no sub-category).
      - name: Classify CSAT
        continue-on-error: true   # OpenAI quota/errors must NOT abort the run; downstream sync/enrich must still execute
        run: |
          for pass in $(seq 1 20); do
            SUB=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d '{"action":"csat-batch-submit","batchSize":100,"model":"gpt-5.4-mini"}')
            BID=$(echo "$SUB" | jq -r '.batchId // empty')
            SUBMITTED=$(echo "$SUB" | jq -r '.submitted // 0')
            echo "Pass $pass: submitted=$SUBMITTED batchId=$BID"
            if [ -z "$BID" ] || [ "$SUBMITTED" = "0" ]; then echo "No more CSAT rows to classify"; break; fi
            for i in $(seq 1 120); do
              ST=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
                -d "{\"action\":\"csat-batch-poll\",\"batchId\":\"$BID\"}" | jq -r '.status // "unknown"')
              echo "  poll $i: $ST"
              if [ "$ST" = "completed" ]; then break; fi
              if [ "$ST" = "failed" ] || [ "$ST" = "expired" ] || [ "$ST" = "cancelled" ]; then echo "batch $ST"; exit 1; fi
              sleep 15
            done
            curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d "{\"action\":\"csat-batch-process\",\"batchId\":\"$BID\"}" | jq -c '{updated}'
          done

      # Step 2: Sync FIN Data
      - name: Sync FIN Data - Enqueue
        id: fin-enqueue
        run: |
          RESP=$(curl -s -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -d '{"action":"it-enqueue","dateFrom":"${{ steps.date.outputs.date }}","dateTo":"${{ steps.date.outputs.date }}"}')
          echo "$RESP"
          JOB_ID=$(echo "$RESP" | jq -r '.jobId // .job.job_identifier // empty')
          echo "jobId=$JOB_ID" >> $GITHUB_OUTPUT

      - name: Sync FIN Data - Poll
        run: |
          JOB_ID="${{ steps.fin-enqueue.outputs.jobId }}"
          if [ -z "$JOB_ID" ]; then echo "No job ID, skipping"; exit 0; fi
          for i in $(seq 1 60); do
            RESP=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d "{\"action\":\"it-poll\",\"jobId\":\"$JOB_ID\"}")
            STATUS=$(echo "$RESP" | jq -r '.status // "unknown"')
            echo "Poll $i: $STATUS"
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "complete" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then echo "Export failed"; exit 1; fi
            sleep 10
          done

      - name: Sync FIN Data - Import
        run: |
          JOB_ID="${{ steps.fin-enqueue.outputs.jobId }}"
          if [ -z "$JOB_ID" ]; then echo "No job ID, skipping"; exit 0; fi
          curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
            -d "{\"action\":\"it-download-import\",\"jobId\":\"$JOB_ID\"}" | jq .

      # Step 2b: Classify Intercom Topics (Main/Sub topics, sentiment, feedback) — loop until done.
      # Server-side batch analyzer (concurrency pool); no browser needed. Re-run safe (only Sub-Topics null/[]).
      - name: Analyze Intercom Topics
        continue-on-error: true   # OpenAI-dependent; a failure here must not block conversation sync + enrichment
        run: |
          for i in $(seq 1 200); do
            RESP=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d '{"action":"topic-analyze-batch","dateFrom":"${{ steps.date.outputs.date }}","dateTo":"${{ steps.date.outputs.date }}","batchSize":50}')
            ANALYZED=$(echo "$RESP" | jq -r '.analyzed // 0')
            REMAINING=$(echo "$RESP" | jq -r '.remaining // 0')
            echo "Batch $i: analyzed=$ANALYZED remaining=$REMAINING"
            if [ "$REMAINING" = "0" ] || [ "$ANALYZED" = "0" ]; then echo "Done!"; break; fi
            sleep 1
          done

      # Step 3: Sync Conversations (SPO) via the REST search API.
      # NOTE: the reporting-data export (consolidated_conversation_part) stopped returning
      # human-served conversations (~2026-07) — it only yields Fin/AI rows now. spo-sync-rest
      # enumerates chat/facebook/instagram conversations from the conversations REST API and
      # seeds one stub per conversation; spo-enrich then rebuilds the per-agent rows. We scan a
      # rolling 4-day window because a reply/reopen can land days after the conversation started.
      - name: Sync Conversations (REST)
        run: |
          for BACK in 3 2 1 0; do
            D=$(TZ='Asia/Dhaka' date -d "${{ steps.date.outputs.date }} - $BACK days" '+%Y-%m-%d')
            CURSOR=""
            for pass in $(seq 1 25); do
              BODY="{\"action\":\"spo-sync-rest\",\"dateFrom\":\"$D\",\"dateTo\":\"$D\",\"maxPages\":40"
              if [ -n "$CURSOR" ]; then BODY="$BODY,\"cursor\":\"$CURSOR\""; fi
              BODY="$BODY}"
              RESP=$(curl -s --max-time 290 -X POST "$API_URL" -H "Content-Type: application/json" -d "$BODY")
              DONE=$(echo "$RESP" | jq -r '.done // false')
              CURSOR=$(echo "$RESP" | jq -r '.nextCursor // ""')
              if [ "$DONE" = "true" ] || [ -z "$CURSOR" ] || [ "$CURSOR" = "null" ]; then break; fi
            done
            echo "$D synced"
          done

      # Step 4: Enrich SPO (loop until done). Cap raised to 3000 so a large backlog (e.g. after a
      # backfill) drains in one robust run instead of leaving thousands pending each night.
      - name: Enrich SPO (FRT/ART/AHT)
        run: |
          for i in $(seq 1 3000); do
            RESP=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d '{"action":"spo-enrich","batchSize":50}')
            ENRICHED=$(echo "$RESP" | jq -r '.enriched // 0')
            REMAINING=$(echo "$RESP" | jq -r '.remaining // 0')
            if [ $((i % 25)) -eq 0 ]; then echo "Batch $i: enriched=$ENRICHED remaining=$REMAINING"; fi
            if [ "$REMAINING" = "0" ]; then echo "Done!"; break; fi
            sleep 1
          done

      # Step 5: Sync Email Replies
      - name: Sync Email - Enqueue
        id: email-enqueue
        run: |
          RESP=$(curl -s -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -d '{"action":"email-dataset-enqueue","dateFrom":"${{ steps.date.outputs.date }}","dateTo":"${{ steps.date.outputs.date }}"}')
          echo "$RESP"
          JOB_ID=$(echo "$RESP" | jq -r '.jobId // empty')
          echo "jobId=$JOB_ID" >> $GITHUB_OUTPUT

      - name: Sync Email - Poll & Import
        run: |
          JOB_ID="${{ steps.email-enqueue.outputs.jobId }}"
          if [ -z "$JOB_ID" ]; then echo "No job ID, skipping"; exit 0; fi
          for i in $(seq 1 60); do
            RESP=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d "{\"action\":\"email-dataset-poll\",\"jobId\":\"$JOB_ID\"}")
            STATUS=$(echo "$RESP" | jq -r '.status // "unknown"')
            echo "Poll $i: $STATUS"
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "complete" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then echo "Export failed"; exit 1; fi
            sleep 10
          done
          curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
            -d "{\"action\":\"email-dataset-import\",\"jobId\":\"$JOB_ID\"}" | jq .

      # Step 6: Enrich Email (loop until done)
      - name: Enrich Email (ART)
        run: |
          for i in $(seq 1 200); do
            RESP=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d '{"action":"spo-enrich-email","batchSize":50}')
            ENRICHED=$(echo "$RESP" | jq -r '.enriched // 0')
            REMAINING=$(echo "$RESP" | jq -r '.remaining // 0')
            echo "Batch $i: enriched=$ENRICHED remaining=$REMAINING"
            if [ "$REMAINING" = "0" ]; then echo "Done!"; break; fi
            sleep 1
          done

      # Step 7: Sync Tickets Dataset
      - name: Sync Tickets - Enqueue
        id: tickets-enqueue
        run: |
          RESP=$(curl -s -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -d '{"action":"tickets-dataset-enqueue","dateFrom":"${{ steps.date.outputs.date }}","dateTo":"${{ steps.date.outputs.date }}"}')
          echo "$RESP"
          JOB_ID=$(echo "$RESP" | jq -r '.jobId // empty')
          echo "jobId=$JOB_ID" >> $GITHUB_OUTPUT

      - name: Sync Tickets - Poll & Import
        run: |
          JOB_ID="${{ steps.tickets-enqueue.outputs.jobId }}"
          if [ -z "$JOB_ID" ]; then echo "No job ID, skipping"; exit 0; fi
          for i in $(seq 1 60); do
            RESP=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d "{\"action\":\"tickets-dataset-poll\",\"jobId\":\"$JOB_ID\"}")
            STATUS=$(echo "$RESP" | jq -r '.status // "unknown"')
            echo "Poll $i: $STATUS"
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "complete" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then echo "Export failed"; exit 1; fi
            sleep 10
          done
          curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
            -d "{\"action\":\"tickets-dataset-import\",\"jobId\":\"$JOB_ID\"}" | jq .

      # Step 8: Enrich Tickets
      - name: Enrich Tickets
        run: |
          curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
            -d '{"action":"ticket-sync","batchSize":250}' | jq .

      # Step 9: Summary
      - name: Print Summary
        run: |
          echo "============================="
          echo "Daily sync completed for ${{ steps.date.outputs.date }}"
          echo "============================="
